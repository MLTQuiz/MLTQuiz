<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Histology Tissue Quiz</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            font-size: clamp(calc(18px/3), calc(18vw/7.2), 18px);
            background: #f5f7fa;
            margin: clamp(calc(40px/3), calc(40vw/7.2), 40px);
            padding-right: 5vw;
            padding-left: 5vw;
        }

        h1 {
            margin-bottom: clamp(calc(10px/3), calc(10vw/7.2), 10px);
            font-size: clamp(calc(36px/3), calc(36vw/7.2), 36px);
        }

        h2 {
            font-size: clamp(calc(27px/3), calc(27vw/7.2), 27px);
        }

        .quiz-container {
            max-width: 800px;
            margin: 0 auto;
            text-align: center;
        }

        .category {
            display: inline-block;
            text-align: center;
            width: 100%;
            background: white;
            padding: clamp(calc(20px/3), calc(20vw/7.2), 20px);
            border-radius: clamp(calc(8px/3), calc(8vw/7.2), 8px);
            box-shadow: 0 clamp(calc(2px/3), calc(2vw/7.2), 2px) clamp(calc(6px/3), calc(6vw/7.2), 6px) rgba(0, 0, 0, 0.1);
            margin-bottom: clamp(calc(15px/3), calc(15vw/7.2), 15px);
            box-sizing: border-box;
        }

        label {
            display: block;
            margin: clamp(calc(6px/3), calc(6vw/7.2), 6px) 0;
            cursor: text;
            font-size: clamp(calc(18px/3), calc(18vw/7.2), 18px);
        }

        .category-title {
            font-size: clamp(calc(20px/3), calc(20vw/7.2), 20px);
            font-weight: bold;
        }

        .question {
            font-size: clamp(calc(24px/3), calc(24vw/7.2), 24px);
            font-weight: bold;
        }

        .main-title {
            font-size: clamp(calc(24px/3), calc(24vw/7.2), 24px);
            font-weight: bold;
        }

        #quizImage {
            margin-top: clamp(calc(20px/3), calc(20vw/7.2), 20px);
            max-width: 100%;
            height: auto;
            border: clamp(calc(2px/3), calc(2vw/7.2), 2px) solid #ccc;
            border-radius: clamp(calc(6px/3), calc(6vw/7.2), 6px);
        }

        button {
            line-height: 1.2;
            font-size: clamp(calc(25px/3), calc(25vw/7.2), 25px);
            padding: clamp(calc(10px/3), calc(10vw/7.2), 10px) clamp(calc(18px/3), calc(18vw/7.2), 18px);
            border-radius: clamp(calc(5px/3), calc(5vw/7.2), 5px);
            border: none;
            background: #2f6fed;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #1f55c4;
        }

        button-back {
            font-size: clamp(calc(15px/3), calc(15vw/7.2), 15px);
            padding: clamp(calc(8px/3), calc(8vw/7.2), 8px) clamp(calc(12px/3), calc(12vw/7.2), 12px);
            border-radius: clamp(calc(6px/3), calc(6vw/7.2), 6px);
            border: none;
            background: #2f6fed;
            color: white;
            cursor: pointer;
        }

        button-back:hover {
            background: #1f55c4;
        }

        .tab1 {
            margin-left: clamp(calc(25px/3), calc(25vw/7.2), 25px);
        }

        .tab2 {
            margin-left: clamp(calc(50px/3), calc(50vw/7.2), 50px);
        }

        #scrollMenu {
            max-height: 300px;
            overflow-y: auto;
            font-size: clamp(calc(18px/3), calc(18vw/7.2), 18px);
            border: clamp(calc(1px/3), calc(1vw/7.2), 1px) solid #ccc;
            padding: clamp(calc(10px/3), calc(10vw/7.2), 10px);
            margin-top: clamp(calc(20px/3), calc(20vw/7.2), 20px);
            text-align: left;
            white-space: nowrap;
        }

        #answerOptions label {
            display: block;
            align-items: center;
            margin-bottom: clamp(calc(10px/3), calc(10vw/7.2), 10px);
            cursor: pointer;
            font-size: clamp(calc(18px/3), calc(18vw/7.2), 18px);
        }

        #answerOptions input[type="radio"] {
            margin-right: clamp(calc(8px/3), calc(8vw/7.2), 8px);
        }

        #answerOptions br {
            display: none;
        }

        .large-textbox {
            font-size: clamp(calc(18px/3), calc(18vw/7.2), 18px);
            width: 100%;
            max-width: 100%;
            box-sizing: border-box;
        }

        .large-textarea {
            font-size: clamp(calc(18px/3), calc(18vw/7.2), 18px);
            font-family: Arial, sans-serif;
            width: clamp(calc(500px/3), calc(500vw/7.2), 500px);
            height: clamp(calc(100px/3), calc(100vw/7.2), 100px);
            resize: none;
        }

        td:nth-child(2) {
            white-space: nowrap;
        }

        td:nth-child(1) {
            white-space: nowrap;
        }
    </style>
</head>

<body>
    <div class="quiz-container">
        <h1>Histology Tissue Quiz</h1>

        <div class="category">
            <span class="question">Identify the Tissue!</span><br>
            <img id="quizImage" src="" alt="Good luck!" /><br>

            <br><span>What tissue is this?</span><br>
            <input type="text" autocomplete="off" class="large-textbox" id="stain_id"></input><br>
            <span id="fb_stain_id"></span><br>

            <div id="answerOptions" style="margin-top: 15px"></div>
            <div id="feedback" style="margin-top: 10px; font-weight: bold"></div><br>
            <button onclick="checkAnswer()">Check Answer</button>

            <br><br>
            <button onclick="nextStain()">Next Tissue</button>

            <br><br>
            <hr><br>

            <button-back id="muteBtn">🔊 Mute</button-back>
            <br><br><br>
            <button-back onclick="Home()">🏠 Home</button-back>
        </div>

    </div>
    <script>
let quizBySubtype = {};
let subtypeList = [];
let currentItem = null;
let imageDatabase = {};
let selectedTissues = [];

// Get the tissues selected on the previous page
const savedTissues = localStorage.getItem("selectedTissues");

if (savedTissues) {
    try {
        selectedTissues = JSON.parse(savedTissues);
    } catch (error) {
        console.error("Could not read selectedTissues:", error);
        selectedTissues = [];
    }
}

console.log("Selected tissues:", selectedTissues);


// Load the tissue database
fetch("histologyTissueDatabase.json")
    .then(res => {
        if (!res.ok) {
            throw new Error(`HTTP error: ${res.status}`);
        }

        return res.json();
    })
    .then(db => {

        imageDatabase = db;

        buildQuizPool();

        nextStain();
    })
    .catch(err => {
        console.error("Error loading JSON:", err);
    });


function buildQuizPool() {

    quizBySubtype = {};
    subtypeList = [];

    const categoryPrefix = {
        "Circulatory System": "c1",
        "Digestive System": "d1",
        "Integumentary (Skin) and Connective Tissue": "i1",
        "Endocrine System": "e1",
        "Lymphatic System": "l1",
        "Nervous System": "n1",
        "Respiratory System": "r1"
    };

    // Get only the codes selected by the user
    const selectedCodes = selectedTissues.map(tissue => tissue.code);

    console.log("Selected codes:", selectedCodes);


    // Go through every system in the JSON
    Object.keys(imageDatabase).forEach(category => {

        const categoryData = imageDatabase[category];
        const prefix = categoryPrefix[category];

        // Go through every tissue in that system
        Object.keys(categoryData).forEach(subtype => {

            const tissueData = categoryData[subtype];

            const count = tissueData.count;
            const code = tissueData.code;


            // IMPORTANT:
            // Skip this tissue if the user did not select it
            if (!selectedCodes.includes(code)) {
                return;
            }


            // Create a pool for this selected tissue
            if (!quizBySubtype[subtype]) {

                quizBySubtype[subtype] = [];

                subtypeList.push(subtype);
            }


            // Add all images for this tissue
            for (let i = 1; i <= count; i++) {

                const num = String(i).padStart(2, "0");

                quizBySubtype[subtype].push({

                    image:
                        `histo_images/tissue/${prefix}${code}${num}.webp`,

                    subtype: subtype,

                    code: code,

                    category: category
                });
            }


            shuffleArray(quizBySubtype[subtype]);
        });
    });


    shuffleArray(subtypeList);


    console.log("Quiz tissues:", subtypeList);
    console.log("Quiz pool:", quizBySubtype);
}


function nextStain() {

    clearInputs();

    if (subtypeList.length === 0) {

        console.error("No selected tissues available.");

        document.getElementById("quizImage").src = "";

        return;
    }


    // Pick a random selected tissue
    const subtypeIndex =
        Math.floor(Math.random() * subtypeList.length);

    const subtype =
        subtypeList[subtypeIndex];

    const pool =
        quizBySubtype[subtype];


    // If all images for this tissue have been used,
    // remove it from the available tissue list.
    if (!pool || pool.length === 0) {

        subtypeList.splice(subtypeIndex, 1);

        nextStain();

        return;
    }


    // Pick one image
    currentItem = pool.pop();


    // Display the image
    document.getElementById("quizImage").src =
        currentItem.image;


    console.log(
        "Current question:",
        currentItem.subtype,
        currentItem.code,
        currentItem.image
    );


    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}


        function buildAnswerOptions() {

    const optionsContainer = document.getElementById("answerOptions");

    // Clear old options
    optionsContainer.innerHTML = "";

    // Create one radio button for each selected tissue
    selectedTissues.forEach(tissue => {

        const label = document.createElement("label");

        const radio = document.createElement("input");
        radio.type = "radio";
        radio.name = "tissueAnswer";
        radio.value = tissue.name;

        label.appendChild(radio);
        label.append(` ${tissue.name}`);

        optionsContainer.appendChild(label);
    });
}


        function clearInputs() {

            document.getElementById("stain_id").value = "";
            document.getElementById("fb_stain_id").textContent = "";
            document.getElementById("feedback").textContent = "";
        }

        function normalize(str) {

            return str
                .toLowerCase()
                .trim()
                .replace(/-/g, " ")
                .replace(/[^a-z0-9\s/]/g, "")
                .replace(/\s+/g, " ");
        }

        function similarity(a, b) {

            const matrix = [];
            const lenA = a.length;
            const lenB = b.length;

            for (let i = 0; i <= lenB; i++) matrix[i] = [i];
            for (let j = 0; j <= lenA; j++) matrix[0][j] = j;

            for (let i = 1; i <= lenB; i++) {

                for (let j = 1; j <= lenA; j++) {

                    if (b.charAt(i - 1) === a.charAt(j - 1)) {

                        matrix[i][j] = matrix[i - 1][j - 1];

                    } else {

                        matrix[i][j] = Math.min(
                            matrix[i - 1][j - 1] + 1,
                            matrix[i][j - 1] + 1,
                            matrix[i - 1][j] + 1
                        );
                    }
                }
            }

            return 1 - matrix[lenB][lenA] / Math.max(lenA, lenB);
        }

        function checkAnswer() {

            if (!currentItem) return;

            const inputEl = document.getElementById("stain_id");
            const fbEl = document.getElementById("fb_stain_id");
            const feedbackEl = document.getElementById("feedback");

            const userAnswer = normalize(inputEl.value);

            const correctAnswer = currentItem.subtype;
            const normalizedCorrect = normalize(correctAnswer);

            let isCorrect = false;
            let closeEnough = false;

            if (userAnswer === normalizedCorrect) {

                isCorrect = true;

            } else if (similarity(userAnswer, normalizedCorrect) > 0.8) {

                isCorrect = true;
                closeEnough = true;
            }

            if (isCorrect) {

                fbEl.textContent = closeEnough
                    ? `✔ Close enough!: ${correctAnswer}`
                    : `✔ Correct: ${correctAnswer}`;

                fbEl.style.color = "green";

                feedbackEl.textContent = "Correct! 🎉";
                feedbackEl.style.color = "green";

                playCorrect();

            } else {

                fbEl.textContent = `✖ Wrong. Correct answer: ${correctAnswer}`;
                fbEl.style.color = "red";

                feedbackEl.textContent = "Try again!";
                feedbackEl.style.color = "orange";

                playWrong();
            }
        }

        function shuffleArray(arr) {

            for (let i = arr.length - 1; i > 0; i--) {

                const j = Math.floor(Math.random() * (i + 1));

                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
        }

        let muted = true;
        let juneEnabled = false;

        const correctSound = new Audio();
        const wrongSound = new Audio();
        const backBtn = new Audio();
        const muteBtn = document.getElementById("muteBtn");

        muteBtn.textContent = "🔇 Unmute";

        function updateSounds() {

            if (juneEnabled) {
                correctSound.src = "sounds/June - I'm eating yogurt.wav";
                wrongSound.src = "sounds/June - Yell 2 (Short).wav";
                document.body.style.backgroundImage = "url('June.jpg')";
                document.body.style.backgroundSize = "33.33vw auto";
                document.body.style.backgroundRepeat = "repeat";
                document.body.style.backgroundPosition = "top left";

            } else {
                correctSound.src = "sounds/correct.mp3";
                wrongSound.src = "";
                backBtn.src = "sounds/June - Come back.wav";
                document.body.style.backgroundImage = "none";
                document.body.style.backgroundColor = "#f5f7fa";
                if (!muted && correctSound.src) {
                    backBtn.currentTime = 0;
                    backBtn.play().catch(() => { });
                }
            }

            correctSound.muted = muted;
            wrongSound.muted = muted;
        }

        function playCorrect() {

            if (!muted && correctSound.src) {

                correctSound.currentTime = 0;
                correctSound.play().catch(() => { });
            }
        }

        function playWrong() {

            if (!muted && wrongSound.src) {

                wrongSound.currentTime = 0;
                wrongSound.play().catch(() => { });
            }
        }

        function toggleMute() {

            muted = !muted;

            correctSound.muted = muted;
            wrongSound.muted = muted;

            muteBtn.textContent = muted ? "🔇 Unmute" : "🔊 Mute";
        }

        muteBtn.addEventListener("click", toggleMute);

        const keysPressed = {};
        let comboActive = false;

        document.addEventListener('keydown', (event) => {

            keysPressed[event.key.toLowerCase()] = true;

            if (keysPressed['j'] && keysPressed['f'] && !comboActive) {

                juneEnabled = !juneEnabled;
                updateSounds();
                comboActive = true;
            }
        });

        document.addEventListener('keyup', (event) => {

            keysPressed[event.key.toLowerCase()] = false;

            if (!keysPressed['j'] || !keysPressed['f']) {

                comboActive = false;
            }
        });

        updateSounds();

        function Home() {
            window.location.href = "index.html";
        }
    </script>
</body>

</html>
